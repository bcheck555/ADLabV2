services:
  ansible:
    build:
      context: .
      dockerfile: Dockerfile
    image: adlabv2-ansible:latest
    # network_mode: host works on Linux (GIT01). The container shares GIT01's
    # network stack and can reach all lab VMs on 192.168.100.0/24 directly.
    network_mode: host
    volumes:
      # Mount the ansible directory as the working directory
      - ../ansible:/ansible
      # Mount SSH keys read-only (labadmin keypair generated by gitlab role)
      - ${USERPROFILE}/.ssh:/root/.ssh:ro
      # Mount lab software packages so win_copy can push ISOs/installers to VMs
      - D:\LabSources\SoftwarePackages:/labsources:ro
    environment:
      - ANSIBLE_CONFIG=/ansible/ansible.cfg
      - ANSIBLE_HOST_KEY_CHECKING=False
      - ANSIBLE_RETRY_FILES_ENABLED=False
      # Uncomment and set if using ansible-vault:
      # - ANSIBLE_VAULT_PASSWORD_FILE=/ansible/.vault_pass

# Usage examples (run from GIT01 in the ADLabV2 repo directory):
#
# Build the image:
#   docker compose build
#
# Run full playbook:
#   docker compose run ansible ansible-playbook site.yml
#
# Run single host:
#   docker compose run ansible ansible-playbook site.yml --limit dc01
#
# Run with tags:
#   docker compose run ansible ansible-playbook site.yml --tags ad
#
# Ad-hoc ping all hosts:
#   docker compose run --entrypoint ansible ansible all -m ping
#
# Interactive shell in container:
#   docker compose run --entrypoint bash ansible
