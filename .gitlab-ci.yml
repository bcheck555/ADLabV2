# ADLabV2 GitLab CI/CD Pipeline
#
# Runner architecture:
#   - hyperv-host  Shell executor (PowerShell) on the Hyper-V host
#                  Required for Packer (Hyper-V API) and OpenTofu
#   - git01        Docker executor on GIT01 (192.168.100.5)
#                  Used for Ansible — runs adlabv2-ansible image, full
#                  network access to all lab VMs via host networking
#
# CI/CD variables (Settings → CI/CD → Variables):
#   - AD_LAB_ADMIN_PASSWORD (masked, protected) — shared lab and host password
#   - SSH_PRIVATE_KEY     (masked, file) — labadmin private key from GIT01
#                                          (/home/labadmin/.ssh/id_ed25519)
#
# Bootstrap note: This pipeline runs AFTER GitLab is up and the git01 runner
# is registered. Initial GIT01 setup is done manually via Build-Lab.ps1.

stages:
  - security
  - packer
  - terraform
  - ansible

# Scan the checked-out working tree only. Historical commits are intentionally
# excluded; local pre-commit scanning checks staged changes before commit.
security:secrets:
  stage: security
  tags: [git01]
  image: golang:1.24
  script:
    - go install github.com/zricethezav/gitleaks/v8@v8.24.2
    - "$(go env GOPATH)/bin/gitleaks" dir --redact .

# ── Packer stages (manual — long-running, triggered explicitly) ───────────────

packer:ws2025:
  stage: packer
  when: manual
  tags: [hyperv-host]
  before_script:
    - if ([string]::IsNullOrWhiteSpace($env:AD_LAB_ADMIN_PASSWORD)) { throw 'Set the protected AD_LAB_ADMIN_PASSWORD CI variable.' }
    - $env:PKR_VAR_ssh_pass = $env:AD_LAB_ADMIN_PASSWORD
  script:
    - packer init packer/ws2025/
    - packer build packer/ws2025/
  rules:
    - changes: [packer/ws2025/**/*]
      when: manual
    - when: manual

packer:win11:
  stage: packer
  when: manual
  tags: [hyperv-host]
  before_script:
    - if ([string]::IsNullOrWhiteSpace($env:AD_LAB_ADMIN_PASSWORD)) { throw 'Set the protected AD_LAB_ADMIN_PASSWORD CI variable.' }
    - $env:PKR_VAR_ssh_pass = $env:AD_LAB_ADMIN_PASSWORD
  script:
    - packer init packer/win11/
    - packer build packer/win11/
  rules:
    - changes: [packer/win11/**/*]
      when: manual
    - when: manual

packer:ubuntu2404:
  stage: packer
  when: manual
  tags: [hyperv-host]
  before_script:
    - if ([string]::IsNullOrWhiteSpace($env:AD_LAB_ADMIN_PASSWORD)) { throw 'Set the protected AD_LAB_ADMIN_PASSWORD CI variable.' }
    - $env:PKR_VAR_ssh_pass = $env:AD_LAB_ADMIN_PASSWORD
  script:
    - packer init packer/ubuntu2404/
    - packer build packer/ubuntu2404/
  rules:
    - changes: [packer/ubuntu2404/**/*]
      when: manual
    - when: manual

# ── OpenTofu stages ───────────────────────────────────────────────────────────

terraform:plan:
  stage: terraform
  tags: [hyperv-host]
  before_script:
    - if ([string]::IsNullOrWhiteSpace($env:AD_LAB_ADMIN_PASSWORD)) { throw 'Set the protected AD_LAB_ADMIN_PASSWORD CI variable.' }
    - $env:TF_VAR_host_password = $env:AD_LAB_ADMIN_PASSWORD
  script:
    - cd terraform
    - tofu init -input=false
    - tofu plan -input=false -out=tfplan
  artifacts:
    paths:
      - terraform/tfplan
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always

terraform:apply:
  stage: terraform
  when: manual
  tags: [hyperv-host]
  before_script:
    - if ([string]::IsNullOrWhiteSpace($env:AD_LAB_ADMIN_PASSWORD)) { throw 'Set the protected AD_LAB_ADMIN_PASSWORD CI variable.' }
    - $env:TF_VAR_host_password = $env:AD_LAB_ADMIN_PASSWORD
  script:
    - cd terraform
    - tofu init -input=false
    - tofu apply -input=false -auto-approve
  dependencies:
    - terraform:plan
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

terraform:destroy:
  stage: terraform
  when: manual
  tags: [hyperv-host]
  before_script:
    - if ([string]::IsNullOrWhiteSpace($env:AD_LAB_ADMIN_PASSWORD)) { throw 'Set the protected AD_LAB_ADMIN_PASSWORD CI variable.' }
    - $env:TF_VAR_host_password = $env:AD_LAB_ADMIN_PASSWORD
  script:
    - cd terraform
    - tofu init -input=false
    - tofu destroy -input=false -auto-approve
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── Ansible stages ────────────────────────────────────────────────────────────
# These jobs run on GIT01 using the Docker executor.
# The adlabv2-ansible image must be pre-built on GIT01:
#   docker compose -f docker/docker-compose.yml build
#
# The runner config on GIT01 (/etc/gitlab-runner/config.toml) must set:
#   [runners.docker]
#     network_mode = "host"   # gives the container direct LabNAT access
#     volumes = ["/cache"]

.ansible_defaults: &ansible_defaults
  stage: ansible
  tags: [git01]
  image: adlabv2-ansible:latest
  variables:
    ANSIBLE_HOST_KEY_CHECKING: "False"
    ANSIBLE_STDOUT_CALLBACK: yaml
    GIT_STRATEGY: clone
  before_script:
    - test -n "$AD_LAB_ADMIN_PASSWORD" || { echo "Set the protected AD_LAB_ADMIN_PASSWORD CI variable." >&2; exit 1; }
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$SSH_PRIVATE_KEY" ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519

ansible:deploy:
  <<: *ansible_defaults
  script:
    - ansible-playbook ansible/site.yml
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

# Workstation-only run — checks VM power state on hvhost first, then
# configures WKS01/WKS02. Safe to re-run; handles licensing rearm reboots.
ansible:deploy-workstations:
  <<: *ansible_defaults
  script:
    - ansible-playbook ansible/site.yml --tags workstations
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - when: manual

ansible:deploy-limit:
  <<: *ansible_defaults
  script:
    - ansible-playbook ansible/site.yml --limit "$ANSIBLE_LIMIT" --tags "$ANSIBLE_TAGS"
  variables:
    ANSIBLE_LIMIT: all
    ANSIBLE_TAGS: ""
  rules:
    - when: manual

ansible:ping:
  <<: *ansible_defaults
  script:
    - ansible -i ansible/inventory/hosts.yml all -m ping
  rules:
    - when: manual
