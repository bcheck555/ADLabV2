---
# common_linux/tasks/main.yml
# Baseline configuration for Linux VMs (GIT01).

- name: Set static IP via netplan
  ansible.builtin.template:
    src: 99-lab-static.yaml.j2
    dest: /etc/netplan/99-lab-static.yaml
    owner: root
    group: root
    mode: '0600'
  notify: apply netplan

- name: Disable cloud-init network regeneration once Ansible owns the configuration
  ansible.builtin.copy:
    content: "network: {config: disabled}\n"
    dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
    owner: root
    group: root
    mode: '0644'

- name: Remove initial cloud-init Netplan file to avoid duplicate routes
  ansible.builtin.file:
    path: /etc/netplan/50-cloud-init.yaml
    state: absent
  notify: apply netplan

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  ignore_errors: true

- name: Ensure /etc/hosts has correct entry
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ ansible_host }} {{ inventory_hostname }}.{{ lab_domain_name }} {{ inventory_hostname }}"
    regexp: "^{{ ansible_host }}"
  ignore_errors: true

- name: Flush handlers (apply netplan before continuing)
  ansible.builtin.meta: flush_handlers
