---
# workstation/tasks/main.yml
# Joins Win11 workstations to the domain.

- name: Rearm Windows license grace period
  ansible.windows.win_powershell:
    script: |
      $status = (cscript //nologo C:\Windows\System32\slmgr.vbs /dli) -join ' '
      if ($status -match 'Notification|Grace|OOBGrace|NonGenuine') {
        cscript //nologo C:\Windows\System32\slmgr.vbs /rearm
        $Ansible.Changed = $true
      } else {
        $Ansible.Changed = $false
      }
  register: rearm_result
  ignore_errors: true

- name: Reboot after rearm
  ansible.windows.win_reboot:
    reboot_timeout: 180
    post_reboot_delay: 15
  when: rearm_result.changed

- name: Wait for SSH after rearm reboot
  ansible.builtin.wait_for_connection:
    delay: 15
    timeout: 180
  when: rearm_result.changed

- include_role:
    name: common_windows
    tasks_from: domain_join
  vars:
    target_ou: 'OU=Workstations,OU=Computers,OU=NETS,{{ lab_domain_dn }}'

- name: Add domain users to local Remote Desktop group
  ansible.windows.win_group_membership:
    name: Remote Desktop Users
    members:
      - "{{ lab_domain_netbios }}\\Domain Users"
    state: present
  ignore_errors: true
