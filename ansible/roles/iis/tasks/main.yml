---
# iis/tasks/main.yml
# Joins domain and installs IIS on WEB01.

- include_role:
    name: common_windows
    tasks_from: domain_join
  vars:
    target_ou: 'OU=Servers,OU=Computers,OU=NETS,{{ lab_domain_dn }}'

- name: Install IIS and management tools
  ansible.windows.win_feature:
    name:
      - Web-Server
      - Web-Common-Http
      - Web-Default-Doc
      - Web-Dir-Browsing
      - Web-Http-Errors
      - Web-Static-Content
      - Web-Http-Logging
      - Web-Stat-Compression
      - Web-Filtering
      - Web-Mgmt-Console
      - Web-Scripting-Tools
      - Web-Asp-Net45
      - Web-Net-Ext45
      - Web-ISAPI-Ext
      - Web-ISAPI-Filter
    state: present
    include_management_tools: true
  register: iis_feature
  ignore_errors: true

- name: Reboot after IIS install
  ansible.windows.win_reboot:
    reboot_timeout: 300
  when: iis_feature.reboot_required

- name: Ensure IIS service is running
  ansible.windows.win_service:
    name: W3SVC
    state: started
    start_mode: auto
  ignore_errors: true

- name: Create lab default page
  ansible.windows.win_powershell:
    script: |
      Set-Content -Path 'C:\inetpub\wwwroot\index.html' -Value @'
      <html><body>
      <h1>ADLabV2 - WEB01</h1>
      <p>IIS is running on {{ inventory_hostname }}.{{ lab_domain_name }}</p>
      </body></html>
      '@ -Encoding UTF8
  ignore_errors: true
